# AI-RAG 最小 CI：后端编译 + 定向单测；前端类型检查 + 构建
# 覆盖 GitHub 镜像（github.com/xcmrfc-thanos/AI-RAG）push / PR 时触发
name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: backend compile & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile backend
        run: mvn -B -f backend/pom.xml compile -DskipTests

      - name: Unit tests (kb-mcp / kb-agent security)
        run: >
          mvn -B -f backend/pom.xml
          -pl kb-mcp,kb-agent -am test
          "-Dtest=McpJsonRpcServiceTest,McpRateLimiterTest,McpServerGateTest,McpReadonlyToolsTest,AgentPermissionConstantsTest,LinearWorkflowEngineTest,AgentRunServiceTest"
          "-Dsurefire.failIfNoSpecifiedTests=false"

  frontend:
    name: frontend type-check & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
