# kb-file 本地兜底：数据源/存储见 Nacos kb-file-dev
server:
  port: 8084

spring:
  application:
    name: kb-file
  profiles:
    active: dev
  cloud:
    nacos:
      config:
        namespace: knowledge
        server-addr: 127.0.0.1:20848
        file-extension: yaml
        group: KNOWLEDGE_BASE
        enabled: true
      discovery:
        server-addr: 127.0.0.1:20848
        namespace: knowledge
        group: ${COMPUTER_ID:${USER:default}}
        ip: 127.0.0.1
  config:
    import:
      - optional:nacos:application-dev.yaml
      - optional:nacos:kb-file-dev.yaml

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.knowledge.base.file.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
