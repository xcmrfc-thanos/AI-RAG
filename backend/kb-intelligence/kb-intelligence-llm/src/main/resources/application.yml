server:
  port: 8086

spring:
  application:
    name: kb-ai

  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:20006/kb_intelligence?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456

  sql:
    init:
      mode: never

  data:
    redis:
      host: 127.0.0.1
      port: 20079
      password: susan123
      database: 2
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 20
          max-wait: 3000ms
          max-idle: 10
          min-idle: 5
          time-between-eviction-runs: 30s

  rabbitmq:
    host: 127.0.0.1
    port: 20572
    username: admin
    password: susan123
    listener:
      simple:
        acknowledge-mode: manual

  # Nacos 服务注册与发现
  cloud:
    nacos:
      config:
        namespace: knowledge
        server-addr: 127.0.0.1:20848
        file-extension: yaml
        group: KNOWLEDGE_BASE
        enabled: true
        username: nacos
        password: nacos
      discovery:
        server-addr: 127.0.0.1:20848
        namespace: knowledge
        group: ${COMPUTER_ID:${USER:default}}
        username: nacos
        password: nacos
        ip: 127.0.0.1
  config:
    import: optional:nacos:kb-ai-dev.yaml
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://127.0.0.1:20920}
    username: elastic
    password: susan123
    connection-timeout: 10s
    socket-timeout: 30s

  # Neo4j配置（KAG知识图谱）
  neo4j:
    uri: ${NEO4J_URI:bolt://127.0.0.1:20687}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:susan123}

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.knowledge.base.ai.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Qwen配置（使用OpenAI兼容接口）
qwen:
  api-key: ${QWEN_API_KEY:}
  base-url: ${QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
  chat:
    options:
      model: ${QWEN_MODEL:qwen3-max}
      temperature: 0.3
      max-tokens: 4000

# DeepSeek配置
deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  model: ${DEEPSEEK_MODEL:deepseek-chat}
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
  max-tokens: 4096
  temperature: 0.7

# 硅基流动（向量 Embedding；与 qwen/deepseek 同级根节点）
siliconflow:
  api-key: ${SILICONFLOW_API_KEY:}
  base-url: ${SILICONFLOW_BASE_URL:https://api.siliconflow.cn/v1}

# kb-core 直连（文档 Feign / 索引重建）
kb-core:
  url: http://localhost:8090
  internal:
    service: kb-intelligence
    secret: ${KB_INTERNAL_HMAC_SECRET:ai-rag-local-dev-hmac-secret-key!!}
    system-user-id: 1000000000000000001

# AI默认配置
ai:
  default-model: qwen
  dev-stub-enabled: ${AI_DEV_STUB:false}
  suggestions:
    items:
      - "如何使用企业知识库？"
      - "查找关于技术文档的内容"
      - "帮我总结最近的文档"
      - "分析文档趋势"

# ==================== RAG配置 ====================
rag:
  enabled: ${RAG_ENABLED:true}
  vector-store: ${RAG_VECTOR_STORE:elasticsearch}
  milvus:
    host: ${MILVUS_HOST:localhost}
    port: ${MILVUS_PORT:19530}
    collection: kb_chunk
    database: default
  chunking:
    chunk-size: ${RAG_CHUNK_SIZE:512}
    chunk-overlap: ${RAG_CHUNK_OVERLAP:64}
    paragraph-aware: true
  embedding:
    model: ${RAG_EMBEDDING_MODEL:text-embedding-v3}
    dimension: ${RAG_EMBEDDING_DIMENSION:1024}
    provider: ${RAG_EMBEDDING_PROVIDER:qwen}
    api-key: ${RAG_EMBEDDING_API_KEY:}
    base-url: ${RAG_EMBEDDING_BASE_URL:}
    batch-size: 10
    cache-enabled: true
    cache-ttl-seconds: 86400
  retrieval:
    default-top-k: 5
    hybrid-top-k: 20
    final-top-k: 5
    rrf-c: 60
    profile: ${RAG_RETRIEVAL_PROFILE:}
    keyword-engine: ${RAG_KEYWORD_ENGINE:}
    dense-engine: ${RAG_DENSE_ENGINE:}
  sparse:
    dimension: ${RAG_SPARSE_DIMENSION:30000}
  rerank:
    enabled: ${RAG_RERANK_ENABLED:true}
    mode: ${RAG_RERANK_MODE:api}
    provider: ${RAG_RERANK_PROVIDER:auto}
    model: ${RAG_RERANK_MODEL:}
    api-key: ${RAG_RERANK_API_KEY:}
    base-url: ${RAG_RERANK_BASE_URL:}
    top-n: ${RAG_RERANK_TOP_N:0}
    max-candidates: ${RAG_RERANK_MAX_CANDIDATES:20}
    timeout-ms: ${RAG_RERANK_TIMEOUT_MS:8000}
  index:
    chunk-index-name: kb_chunk
  async:
    enabled: true
    reindex-batch-size: 10

# ==================== KAG配置（知识图谱增强生成） ====================
kag:
  enabled: ${KAG_ENABLED:true}
  extraction:
    batch-size: ${KAG_EXTRACTION_BATCH_SIZE:5}
    max-entities-per-chunk: 10
    max-relations-per-chunk: 15
    model: qwen
    max-retries: 2
    similarity-threshold: 0.85
  graph:
    database: neo4j
    clear-before-build: true
    batch-write-size: 50
  retrieval:
    max-hops: ${KAG_MAX_HOPS:2}
    max-entities-per-query: 10
    max-chunks-per-entity: 3
    timeout-seconds: 10
  fusion:
    rerank-enabled: true
    rag-weight: 0.5
    kag-weight: 0.5
  async:
    enabled: true
    build-batch-size: 5
    max-retries: 3

# 日志配置
logging:
  level:
    com.knowledge.base.ai: DEBUG
    com.baomidou.mybatisplus: DEBUG
    dev.ai4j.openai4j: TRACE
    dev.langchain4j: DEBUG
    okhttp3: DEBUG
    okhttp3.OkHttpClient: DEBUG
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n'
