# kb-intelligence 本地兜底：AI/检索/图数据库见 Nacos kb-intelligence-dev
server:
  port: 8091

spring:
  application:
    name: kb-intelligence
  profiles:
    active: dev
  cloud:
    nacos:
      config:
        namespace: knowledge
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:20848}
        file-extension: yaml
        group: KNOWLEDGE_BASE
        enabled: true
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:20848}
        namespace: knowledge
        group: ${COMPUTER_ID:${USER:default}}
        ip: ${NACOS_DISCOVERY_IP:127.0.0.1}
  config:
    import:
      - optional:nacos:application-dev.yaml
      - optional:nacos:kb-intelligence-dev.yaml

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.knowledge.base.search.entity,com.knowledge.base.ai.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ---------- 可观测性：Actuator + Prometheus（网关外不可达，仅内网抓取） ----------
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
