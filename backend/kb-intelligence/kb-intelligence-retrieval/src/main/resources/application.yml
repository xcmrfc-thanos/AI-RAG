server:
  port: 8083

spring:
  application:
    name: kb-search
  profiles:
    active: dev

  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:20006/kb_intelligence?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 30
      max-wait: 60000

  # Nacos 服务注册与发现
  cloud:
    nacos:
      config:
        namespace: knowledge
        server-addr: 127.0.0.1:20848
        file-extension: yaml
        group: KNOWLEDGE_BASE
        enabled: true
        username: nacos
        password: nacos
      discovery:
        server-addr: 127.0.0.1:20848
        namespace: knowledge
        group: ${COMPUTER_ID:${USER:default}}
        username: nacos
        password: nacos
        ip: 127.0.0.1
  config:
    import: optional:nacos:kb-search-dev.yaml

  # Redis配置
  data:
    redis:
      host: localhost
      port: 20079
      password:
      database: 2
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 3000ms

  rabbitmq:
    host: 127.0.0.1
    port: 20572
    username: admin
    password: susan123
    virtual-host: /

  # Elasticsearch配置
  elasticsearch:
    uris: http://127.0.0.1:20920
    host: 127.0.0.1
    port: 20920
    username: elastic
    password: susan123

# MyBatis Plus配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.knowledge.base.document.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# kb-core 直连（文档内容拉取）
kb-core:
  url: http://localhost:8090
  internal:
    service: kb-intelligence
    secret: ${KB_INTERNAL_HMAC_SECRET:ai-rag-local-dev-hmac-secret-key!!}
    system-user-id: 1000000000000000001

# Knife4j配置
knife4j:
  enable: true
  setting:
    language: zh_cn
  production: false

# 日志配置
logging:
  level:
    com.knowledge.base: debug
    org.springframework: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"
