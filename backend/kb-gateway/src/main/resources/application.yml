# kb-gateway 本地兜底：路由/中间件见 Nacos kb-gateway-dev
server:
  port: ${GATEWAY_PORT:18080}

spring:
  profiles:
    active: dev
  application:
    name: kb-gateway
  main:
    web-application-type: reactive
  cloud:
    nacos:
      config:
        namespace: knowledge
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:20848}
        file-extension: yaml
        group: KNOWLEDGE_BASE
        enabled: true
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:20848}
        namespace: knowledge
        group: ${COMPUTER_ID:${USER:default}}
        ip: ${NACOS_DISCOVERY_IP:127.0.0.1}
        metadata:
          developer: ${COMPUTER_ID:${USER:unknown}}
  config:
    import:
      - optional:nacos:application-dev.yaml
      - optional:nacos:kb-gateway-dev.yaml

# Nacos 不可用时的白名单兜底（与 nacos 模板同值）
gateway:
  white-list:
    - /api/auth/auth/login
    - /api/auth/auth/register
    - /api/auth/auth/refresh
    - /api/document/share/**
    - /actuator/health
    - /actuator/health/**

# ---------- 可观测性：Actuator + Prometheus（网关外不可达，仅内网抓取） ----------
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
