# AI-RAG 本地基础环境（Windows Docker Desktop）
# 宿主机端口见 .env（20000-21000 段），容器内端口不变

name: ai-rag

services:
  mysql:
    image: mysql:8.0
    container_name: kb-mysql
    restart: "no"
    ports:
      - "${MYSQL_PORT:-20006}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max_connections=200
      - --innodb_buffer_pool_size=256M
    volumes:
      - mysql_data:/var/lib/mysql
      - ../backend/sql/schema:/sql-schema:ro
      - ./mysql/init-schema.sh:/docker-entrypoint-initdb.d/01-init-kb-schema.sh:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 768m
    cpus: 1.0

  redis:
    image: redis:7.2-alpine
    container_name: kb-redis
    restart: "no"
    ports:
      - "${REDIS_PORT:-20079}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-susan123} --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-susan123}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 192m
    cpus: 0.25

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: kb-rabbitmq
    restart: "no"
    ports:
      - "${RABBITMQ_PORT:-20572}:5672"
      - "${RABBITMQ_MGMT_PORT:-20156}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-susan123}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s
    mem_limit: 384m
    cpus: 0.5

  mongodb:
    image: mongo:7
    container_name: kb-mongodb
    restart: "no"
    ports:
      - "${MONGO_PORT:-20017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-susan123}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-knowledge_base}
    volumes:
      - mongo_data:/data/db
      - ./mongo/init-user.js:/docker-entrypoint-initdb.d/init-user.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "-u", "${MONGO_ROOT_USER:-root}", "-p", "${MONGO_ROOT_PASSWORD:-susan123}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s
    mem_limit: 512m
    cpus: 0.5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: kb-elasticsearch
    restart: "no"
    ports:
      - "${ES_PORT:-20920}:9200"
    environment:
      node.name: kb-es
      cluster.name: kb-es
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-susan123}
      ES_JAVA_OPTS: -Xms256m -Xmx512m
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:${ELASTIC_PASSWORD:-susan123} http://localhost:9200/_cluster/health | grep -q '\"status\"'"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    mem_limit: 1g
    cpus: 1.0

  neo4j:
    image: neo4j:5.15-community
    container_name: kb-neo4j
    restart: "no"
    ports:
      - "${NEO4J_HTTP_PORT:-20474}:7474"
      - "${NEO4J_BOLT_PORT:-20687}:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/susan123}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p susan123 'RETURN 1' 2>/dev/null || exit 1"]
      interval: 20s
      timeout: 15s
      retries: 10
      start_period: 60s
    mem_limit: 768m
    cpus: 0.5

  rustfs:
    image: rustfs/rustfs:latest
    container_name: kb-rustfs
    restart: "no"
    ports:
      - "${RUSTFS_PORT:-20090}:9000"
      - "${RUSTFS_CONSOLE_PORT:-20091}:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      RUSTFS_CONSOLE_ENABLE: "true"
    command:
      - --console-enable
      - --access-key
      - ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      - --secret-key
      - ${RUSTFS_SECRET_KEY:-rustfsadmin}
      - /data
    volumes:
      - rustfs_data:/data
    healthcheck:
      # RustFS 根路径常返回 403（需鉴权），HTTP 可达即视为 healthy
      test: ["CMD-SHELL", "code=$$(curl -s -o /dev/null -w '%{http_code}' http://localhost:9000/); echo $$code | grep -qE '^(200|401|403|404)$'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s
    mem_limit: 384m
    cpus: 0.25

  nacos:
    image: nacos/nacos-server:v2.5.1
    container_name: kb-nacos
    restart: "no"
    ports:
      - "${NACOS_PORT:-20848}:8848"
      - "${NACOS_GRPC_PORT:-21848}:9848"
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 512m
    volumes:
      - nacos_data:/home/nacos/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 45s
    mem_limit: 640m
    cpus: 0.5

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  mongo_data:
  es_data:
  neo4j_data:
  rustfs_data:
  nacos_data:
