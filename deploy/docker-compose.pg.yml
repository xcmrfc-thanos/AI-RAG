# PostgreSQL 最小全栈冒烟（与默认 MySQL compose 并行，不替换）
# 用法：
#   cd deploy
#   docker compose -f docker-compose.pg.yml --env-file profiles/postgresql.env.example up -d
#   .\scripts\smoke-pg-stack.ps1

name: ai-rag-pg

services:
  postgres:
    image: postgres:16-alpine
    container_name: kb-postgres
    restart: "no"
    ports:
      - "${PG_PORT:-25432}:5432"
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-pg_smoke_pass}
      POSTGRES_DB: ${PG_DATABASE:-postgres}
      TZ: Asia/Shanghai
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../backend/sql/schema/postgresql:/schema:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres} -d ${PG_DATABASE:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    mem_limit: 512m
    cpus: 0.5

volumes:
  pg_data:
