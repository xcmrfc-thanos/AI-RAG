apiVersion: 1

# 邮件接收人：provisioning 仅首建生效，后续可在 UI 联络点中直接修改收件邮箱；
# SMTP 服务器由 compose 的 GF_SMTP_* 环境变量（deploy/.env）配置。
contactPoints:
  - orgId: 1
    name: ai-rag-email
    receivers:
      - uid: ai-rag-email-receiver
        type: email
        isDefault: false
        settings:
          addresses: alert@ai-rag.local
