apiVersion: 1

# 告警规则：服务下线 / 5xx 持续速率过高
groups:
  - orgId: 1
    name: ai-rag-availability
    folder: AI-RAG
    interval: 1m
    rules:
      - uid: ai-rag-service-down
        title: 服务下线（3 分钟不可达）
        condition: C
        for: 3m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "服务 {{ $labels.instance }} 连续 3 分钟未上报指标"
        labels:
          severity: critical
          stack: ai-rag
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: up{job="ai-rag-services"}
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    params: [0, 0]
                    type: lt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
              reducer: last
              expression: A
              type: reduce
              refId: C

      - uid: ai-rag-high-5xx
        title: 5xx 速率过高（>5 req/s 持续 5 分钟）
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "服务 {{ $labels.application }} 5xx 速率超过阈值"
        labels:
          severity: warning
          stack: ai-rag
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              expr: sum by (application) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    params: [5]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
              reducer: last
              expression: A
              type: threshold
              refId: C
