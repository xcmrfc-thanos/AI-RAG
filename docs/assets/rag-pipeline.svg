<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 680" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1122"/>
      <stop offset="1" stop-color="#0E1B36"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7DD3FC"/>
      <stop offset="0.55" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(148,163,184,0.06)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glowCyan" cx="0.15" cy="0.05" r="0.6">
      <stop offset="0" stop-color="rgba(34,211,238,0.10)"/>
      <stop offset="1" stop-color="rgba(34,211,238,0)"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
    <marker id="arrv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A78BFA"/>
    </marker>
  </defs>

  <rect width="1360" height="680" fill="url(#bg)"/>
  <rect width="1360" height="680" fill="url(#grid)"/>
  <rect width="1360" height="680" fill="url(#glowCyan)"/>
  <path d="M 20 20 h 28 M 20 20 v 28" stroke="rgba(103,232,249,0.5)" stroke-width="2" fill="none"/>
  <path d="M 1340 20 h -28 M 1340 20 v 28" stroke="rgba(103,232,249,0.5)" stroke-width="2" fill="none"/>
  <path d="M 20 660 h 28 M 20 660 v -28" stroke="rgba(167,139,250,0.5)" stroke-width="2" fill="none"/>
  <path d="M 1340 660 h -28 M 1340 660 v -28" stroke="rgba(167,139,250,0.5)" stroke-width="2" fill="none"/>
  <text x="1336" y="44" text-anchor="end" font-family="Consolas, monospace" font-size="13" fill="rgba(103,232,249,0.45)">SYS://AI-RAG · RAG-PIPELINE</text>

  <text x="680" y="46" text-anchor="middle" font-size="30" font-weight="800" fill="url(#titleGrad)" filter="url(#glow)">RAG 主链路 · 入库与检索问答</text>
  <text x="680" y="74" text-anchor="middle" font-size="14" fill="#7C8DB0">段落感知切片 · Redis 向量缓存 · BM25 + Dense 并行召回 · RRF 融合 · 可选重排 · 带引用流式回答</text>

  <!-- ======== ① 入库链路 ======== -->
  <rect x="60" y="100" width="1240" height="190" rx="12" fill="#141F3A" fill-opacity="0.55" stroke="rgba(148,163,184,0.22)"/>
  <circle cx="88" cy="126" r="4" fill="#A78BFA"/>
  <text x="100" y="131" font-size="13" font-weight="700" fill="#9AB0CC">① 入库链路 INDEXING · kb-file → kb-intelligence</text>
  <g text-anchor="middle">
    <rect x="84"  y="142" width="222" height="92" rx="10" fill="rgba(167,139,250,0.08)" stroke="rgba(167,139,250,0.55)" stroke-width="1.5" filter="url(#glow)"/>
    <text x="195" y="166" font-size="13.5" font-weight="700" fill="#C4B5FD">文档上传</text>
    <text x="195" y="186" font-size="11" fill="#8CA0BF">kb-file 秒传 / 分片续传</text>
    <text x="195" y="202" font-size="11" fill="#8CA0BF">SHA-256 预检 check-hash</text>
    <text x="195" y="218" font-size="11" fill="#8CA0BF">≥20MB 分片 · 上限约 500MB</text>
    <rect x="326" y="142" width="222" height="92" rx="10" fill="rgba(167,139,250,0.08)" stroke="rgba(167,139,250,0.55)" stroke-width="1.5" filter="url(#glow)"/>
    <text x="437" y="166" font-size="13.5" font-weight="700" fill="#C4B5FD">解析</text>
    <text x="437" y="186" font-size="11" fill="#8CA0BF">Markdown / Office / PDF</text>
    <text x="437" y="202" font-size="11" fill="#8CA0BF">提取结构化文本</text>
    <rect x="568" y="142" width="222" height="92" rx="10" fill="rgba(167,139,250,0.08)" stroke="rgba(167,139,250,0.55)" stroke-width="1.5" filter="url(#glow)"/>
    <text x="679" y="166" font-size="13.5" font-weight="700" fill="#C4B5FD">段落感知切片</text>
    <text x="679" y="186" font-size="11" fill="#8CA0BF">标题分章 → 分段</text>
    <text x="679" y="202" font-size="11" fill="#8CA0BF">token 合并 / 重叠</text>
    <text x="679" y="218" font-size="11" fill="#8CA0BF">块带最近标题上下文</text>
    <rect x="810" y="142" width="222" height="92" rx="10" fill="rgba(167,139,250,0.08)" stroke="rgba(167,139,250,0.55)" stroke-width="1.5" filter="url(#glow)"/>
    <text x="921" y="166" font-size="13.5" font-weight="700" fill="#C4B5FD">向量化</text>
    <text x="921" y="186" font-size="11" fill="#8CA0BF">OpenAI 兼容 Embedding</text>
    <text x="921" y="202" font-size="11" fill="#8CA0BF">Redis 哈希缓存 · TTL 24h</text>
    <text x="921" y="218" font-size="11" fill="#8CA0BF">公网 / 内网 / local</text>
    <rect x="1052" y="142" width="222" height="92" rx="10" fill="rgba(167,139,250,0.08)" stroke="rgba(167,139,250,0.55)" stroke-width="1.5" filter="url(#glow)"/>
    <text x="1163" y="166" font-size="13.5" font-weight="700" fill="#C4B5FD">索引写入</text>
    <text x="1163" y="186" font-size="11" fill="#8CA0BF">ES BM25 倒排</text>
    <text x="1163" y="202" font-size="11" fill="#8CA0BF">Dense：Qdrant / Milvus</text>
    <text x="1163" y="218" font-size="11" fill="#8CA0BF">双写可选（白名单形态）</text>
  </g>
  <line x1="306" y1="188" x2="326" y2="188" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="548" y1="188" x2="568" y2="188" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="790" y1="188" x2="810" y2="188" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="1032" y1="188" x2="1052" y2="188" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>

  <path d="M 1163 290 L 1163 318 L 437 318 L 437 342" fill="none" stroke="#A78BFA" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrv)"/>
  <text x="800" y="312" text-anchor="middle" font-size="11" fill="#A78BFA">写入索引 ▸ 供检索召回</text>

  <!-- ======== ② 查询链路 ======== -->
  <rect x="60" y="346" width="1240" height="190" rx="12" fill="#141F3A" fill-opacity="0.55" stroke="rgba(148,163,184,0.22)"/>
  <circle cx="88" cy="372" r="4" fill="#22D3EE"/>
  <text x="100" y="377" font-size="13" font-weight="700" fill="#9AB0CC">② 查询链路 QUERY · kb-intelligence（/ai · 网关 JWT · 回答 SSE 流式）</text>
  <g text-anchor="middle">
    <rect x="84"  y="388" width="222" height="92" rx="10" fill="rgba(34,211,238,0.07)" stroke="rgba(34,211,238,0.55)" stroke-width="1.5" filter="url(#glow)"/>
    <text x="195" y="412" font-size="13.5" font-weight="700" fill="#7DD3FC">用户提问</text>
    <text x="195" y="432" font-size="11" fill="#8CA0BF">前端 / API 经网关</text>
    <text x="195" y="448" font-size="11" fill="#8CA0BF">JWT → 可信用户头</text>
    <rect x="326" y="388" width="222" height="92" rx="10" fill="rgba(34,211,238,0.07)" stroke="rgba(34,211,238,0.55)" stroke-width="1.5" filter="url(#glow)"/>
    <text x="437" y="412" font-size="13.5" font-weight="700" fill="#7DD3FC">混合检索</text>
    <text x="437" y="432" font-size="11" fill="#8CA0BF">BM25 ∥ Dense 并行召回</text>
    <text x="437" y="448" font-size="11" fill="#8CA0BF">TopK 可配（热读）</text>
    <rect x="568" y="388" width="222" height="92" rx="10" fill="rgba(34,211,238,0.07)" stroke="rgba(34,211,238,0.55)" stroke-width="1.5" filter="url(#glow)"/>
    <text x="679" y="412" font-size="13.5" font-weight="700" fill="#7DD3FC">融合</text>
    <text x="679" y="432" font-size="11" fill="#8CA0BF">默认 RRF</text>
    <text x="679" y="448" font-size="11" fill="#8CA0BF">可选加权 RAG_HYBRID_*</text>
    <rect x="810" y="388" width="222" height="92" rx="10" fill="rgba(34,211,238,0.07)" stroke="rgba(34,211,238,0.55)" stroke-width="1.5" stroke-dasharray="6 4" filter="url(#glow)"/>
    <text x="921" y="412" font-size="13.5" font-weight="700" fill="#7DD3FC">重排（可选）</text>
    <text x="921" y="432" font-size="11" fill="#8CA0BF">api：专用 Rerank HTTP</text>
    <text x="921" y="448" font-size="11" fill="#8CA0BF">llm：对话模型精排</text>
    <text x="921" y="464" font-size="11" fill="#8CA0BF">auto / 通义 / 硅基 · 内网可关</text>
    <rect x="1052" y="388" width="222" height="92" rx="10" fill="rgba(34,211,238,0.07)" stroke="rgba(34,211,238,0.55)" stroke-width="1.5" filter="url(#glow)"/>
    <text x="1163" y="412" font-size="13.5" font-weight="700" fill="#7DD3FC">生成回答</text>
    <text x="1163" y="432" font-size="11" fill="#8CA0BF">对话模型流式输出（SSE）</text>
    <text x="1163" y="448" font-size="11" fill="#8CA0BF">Citation：文档 ID / 标题</text>
    <text x="1163" y="464" font-size="11" fill="#8CA0BF">片段摘要 · 相关度</text>
  </g>
  <line x1="306" y1="434" x2="326" y2="434" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="548" y1="434" x2="568" y2="434" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="790" y1="434" x2="810" y2="434" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="1032" y1="434" x2="1052" y2="434" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ======== 要点 ======== -->
  <g text-anchor="middle">
    <rect x="84"  y="576" width="384" height="64" rx="10" fill="rgba(20,31,58,0.6)" stroke="rgba(148,163,184,0.3)" stroke-width="1.5"/>
    <text x="276" y="598" font-size="12.5" font-weight="700" fill="#CBD5E1">形态白名单</text>
    <text x="276" y="616" font-size="11" fill="#8CA0BF">es-es · es-qdrant · qdrant-qdrant</text>
    <text x="276" y="632" font-size="11" fill="#8CA0BF">es-milvus · milvus-milvus</text>
    <rect x="488" y="576" width="384" height="64" rx="10" fill="rgba(20,31,58,0.6)" stroke="rgba(148,163,184,0.3)" stroke-width="1.5"/>
    <text x="680" y="598" font-size="12.5" font-weight="700" fill="#CBD5E1">参数双通道（不同步）</text>
    <text x="680" y="616" font-size="11" fill="#8CA0BF">TopK / 重排开关：写库 + Redis 热读</text>
    <text x="680" y="632" font-size="11" fill="#8CA0BF">连接地址 / Key：.env / Nacos</text>
    <rect x="892" y="576" width="384" height="64" rx="10" fill="rgba(20,31,58,0.6)" stroke="rgba(148,163,184,0.3)" stroke-width="1.5"/>
    <text x="1084" y="598" font-size="12.5" font-weight="700" fill="#CBD5E1">索引一致性</text>
    <text x="1084" y="616" font-size="11" fill="#8CA0BF">换 Embedding Provider / 维度</text>
    <text x="1084" y="632" font-size="11" fill="#8CA0BF">须重建索引后重新检索</text>
  </g>
</svg>
